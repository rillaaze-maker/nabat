<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبات · پنل طراحی</title>
<link href="../fonts.css" rel="stylesheet">
<style>
  :root{--paper:#f6f1e7;--ink:#1d1b18;--ink2:#6b655c;--green:#3a7d47;--line:#d9d1c2}
  *{box-sizing:border-box;margin:0}
  body{background:#ece6da;color:var(--ink);font-family:'Bonyade Koodak',Dana,sans-serif;font-size:14px}
  button,select,input,textarea{font:inherit;color:inherit}
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:3}
  header h1{font:700 18px Shoor,'Bonyade Koodak',sans-serif;margin-inline-end:auto}
  .btn{padding:6px 14px;border:1.3px solid var(--ink);border-radius:16px 12px 18px 12px;background:var(--paper);cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
  .btn.main{background:var(--ink);color:var(--paper)}
  .btn.green{border-color:var(--green);color:var(--green)}
  .btn[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--paper)}
  main{display:grid;grid-template-columns:minmax(320px,1fr) 400px;gap:18px;padding:18px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}.phonecol{order:-1}}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;min-height:70vh}
  .tabs{display:flex;gap:6px;padding:12px 12px 0;border-bottom:1px solid var(--line)}
  .tabs button{padding:8px 14px;border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink2)}
  .tabs button.on{border-bottom-color:var(--green);color:var(--ink)}
  .pane{padding:14px 16px 30px;display:none}
  .pane.on{display:block}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .tools input[type=search]{flex:1;min-width:180px;padding:7px 12px;border:1.2px solid var(--line);border-radius:12px;background:#fff}
  .group{margin:18px 0 6px;font:700 15px Shoor,sans-serif;color:var(--green)}
  .item{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
  .item .k{font:12px ui-monospace,Consolas,monospace;color:var(--ink2);direction:ltr;text-align:left;padding-top:6px;word-break:break-all}
  .item textarea{width:100%;min-height:36px;padding:6px 10px;border:1.2px solid var(--line);border-radius:10px;background:#fff;resize:vertical;line-height:1.8}
  .item.changed textarea{border-color:var(--green);background:#f3f8f1}
  .item .reset{visibility:hidden;font-size:12px;color:var(--ink2);background:none;border:none;cursor:pointer;padding-top:8px}
  .item.changed .reset{visibility:visible}
  .frow{display:grid;grid-template-columns:150px 1fr 80px 70px;gap:8px;align-items:center;padding:7px 6px;border-bottom:1px dashed var(--line);border-radius:8px}
  .frow.hi{background:#e6f0e2}
  .frow select,.frow input{padding:5px 8px;border:1.2px solid var(--line);border-radius:10px;background:#fff;width:100%}
  .frow .sample{grid-column:1/-1;color:var(--ink2);font-size:13px}
  .field{margin:14px 0}
  .field label{display:block;color:var(--ink2);margin-bottom:6px}
  .field select{padding:6px 10px;border:1.2px solid var(--line);border-radius:10px;background:#fff;min-width:220px}
  .phonecol{position:sticky;top:78px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .jump{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .jump button{padding:4px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;font-size:12px}
  .jump button.on{border-color:var(--green);color:var(--green)}
  .phone{width:375px;height:760px;border:1.5px solid var(--ink);border-radius:36px 32px 38px 34px;overflow:hidden;background:var(--paper)}
  .phone iframe{width:100%;height:100%;border:0}
  .msg{color:var(--green);font-size:12px}
  .note{color:var(--ink2);font-size:12px;line-height:1.9}
</style>
</head>
<body>
<header>
  <h1>پنل طراحی نبات</h1>
  <button class="btn main" id="dl">دانلود design.json</button>
  <button class="btn" id="clear">پاک کردن همه‌ی تغییرها</button>
  <a class="btn green" href="../" target="_blank" rel="noopener">باز کردن اپ ←</a>
  <a class="btn" href="prototype.html">پروتوتایپ قدیمی</a>
  <span class="msg" id="msg"></span>
</header>
<main>
  <section class="panel">
    <div class="tabs"><button data-tab="copy" class="on">متن‌ها</button><button data-tab="fonts">قلم‌ها</button><button data-tab="art">نقاشی و حرکت</button></div>
    <div class="pane on" id="pane-copy">
      <div class="tools"><input type="search" id="q" placeholder="جستجو در متن‌ها یا کلیدها…"><label><input type="checkbox" id="onlyChanged"> فقط تغییرکرده‌ها</label></div>
      <p class="note">هر متن را عوض کنی، همان لحظه در گوشیِ کنار دیده می‌شود. {n} و {name} و… جای عددها و نام‌هاست؛ نگهشان دار.</p>
      <div id="copyList"></div>
    </div>
    <div class="pane" id="pane-fonts">
      <div class="tools"><button class="btn" id="pick" aria-pressed="false">انتخاب از روی صفحه</button><span class="note">روشنش کن و روی هر نوشته در گوشی بزن.</span></div>
      <div id="fontList"></div>
    </div>
    <div class="pane" id="pane-art">
      <div class="field"><label>طرح نقاشی</label><select id="artSel"><option value="a2">قلم‌مو (نسخه‌ی دوم)</option><option value="a1">خط ساده (نسخه‌ی اول)</option></select></div>
      <div class="field"><label>آغاز (اسپلش)</label><select id="splashSel"></select></div>
      <div class="field"><label><input type="checkbox" id="boil"> لرزش خط (حس دست‌کشیده)</label></div>
      <p class="note">نسخه‌های قدیمی‌تر نقاشی‌ها و همه‌ی آزمایش‌ها در «پروتوتایپ قدیمی» نگه داشته شده‌اند.</p>
    </div>
  </section>
  <div class="phonecol">
    <div class="jump" id="jump"></div>
    <div class="phone"><iframe id="app" title="اپ نبات" src="../index.html?preview=1&demo=1&screen=today"></iframe></div>
    <button class="btn" id="demo">بازگرداندن داده‌ی نمونه</button>
  </div>
</main>
<script>
const FAMS = { 'Dana': [100, 200, 300, 400, 500, 600, 700, 800, 900], 'Bonyade Koodak': [400, 700, 900], 'Croissant': [300, 700],
  'Haiku Kharaman': [200, 400, 500, 700], 'Haiku Davan': [200, 400, 500, 700], 'Shoor': [400, 700], 'Shoor Rounded': [400, 700], 'Hafez': [400], 'Amiri Quran': [400] };
const GROUPS = { splash: 'آغاز و نیت', ob: 'معرفی', today: 'امروز (باغ)', plant: 'گیاه', stage: 'مرحله‌های رشد', water: 'آب دادن', watered: 'پایان آب دادن',
  sow: 'کاشتن', deep: 'شیوه‌ی عمیق', planted: 'پس از کاشتن', rev: 'روایت', set: 'تنظیمات', toast: 'پیام‌های کوتاه', preview: 'پیش‌نمایش' };
const SCREENS = [['splash', 'آغاز'], ['seeds', 'دانه‌ها'], ['pace', 'آهنگ'], ['remind', 'یادآور'], ['today', 'امروز'], ['water', 'آب دادن'], ['sow', 'کاشتن'], ['settings', 'تنظیمات']];
const DKEY = 'nabat-design-v1';
const $ = id => document.getElementById(id);
const frame = $('app');
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let BASE = null, design = null, defaultsCopy = {}, roles = {};
const flash = t => { $('msg').textContent = t; clearTimeout(flash.t); flash.t = setTimeout(() => $('msg').textContent = '', 2200); };

async function init() {
  try { BASE = await (await fetch('../design.json', { cache: 'no-cache' })).json(); } catch (e) { BASE = {}; }
  BASE.fonts = BASE.fonts || {}; BASE.copy = BASE.copy || {};
  const local = store.get(DKEY) || {};
  design = { ...BASE, ...local, fonts: { ...BASE.fonts, ...(local.fonts || {}) }, copy: { ...BASE.copy, ...(local.copy || {}) } };
  frame.addEventListener('load', onFrame);
  if (frame.contentWindow && frame.contentWindow.NABAT_ROLES) onFrame();
}
function onFrame() {
  const w = frame.contentWindow;
  if (!w.NABAT_ROLES) return setTimeout(onFrame, 150);
  roles = w.NABAT_ROLES; defaultsCopy = w.NABAT_COPY_DEFAULTS || {};
  buildCopy(); buildFonts(); buildArt(); buildJump(); hookPick();
  w.NABAT_setDesign(design);
}
function push() { store.set(DKEY, design); try { frame.contentWindow.NABAT_setDesign(design); } catch (e) {} }

/* ---------- copy ---------- */
function buildCopy() {
  const q = $('q').value.trim(), only = $('onlyChanged').checked;
  let html = '', lastGroup = '';
  for (const k of Object.keys(defaultsCopy)) {
    const def = defaultsCopy[k], val = design.copy[k] ?? def, changed = design.copy[k] !== undefined && design.copy[k] !== def;
    if (only && !changed) continue;
    if (q && !(k.includes(q) || String(val).includes(q) || String(def).includes(q))) continue;
    const g = k.split('.')[0];
    if (g !== lastGroup) { html += `<p class="group">${GROUPS[g] || g}</p>`; lastGroup = g; }
    html += `<div class="item ${changed ? 'changed' : ''}" data-k="${k}"><span class="k">${k}</span>
      <textarea rows="${String(val).length > 60 ? 3 : 1}">${String(val).replace(/</g, '&lt;')}</textarea><button class="reset">بازنشانی</button></div>`;
  }
  $('copyList').innerHTML = html || '<p class="note">چیزی پیدا نشد.</p>';
}
$('copyList').addEventListener('input', e => {
  const it = e.target.closest('.item'); if (!it) return; const k = it.dataset.k, v = e.target.value;
  if (v === defaultsCopy[k]) delete design.copy[k]; else design.copy[k] = v;
  it.classList.toggle('changed', design.copy[k] !== undefined);
  clearTimeout(push.t); push.t = setTimeout(push, 220);
});
$('copyList').addEventListener('click', e => {
  if (!e.target.classList.contains('reset')) return; const k = e.target.closest('.item').dataset.k;
  delete design.copy[k]; push(); buildCopy();
});
$('q').oninput = buildCopy; $('onlyChanged').onchange = buildCopy;

/* ---------- fonts ---------- */
function buildFonts() {
  $('fontList').innerHTML = Object.entries(roles).map(([r, label]) => {
    const c = design.fonts[r] || {}; const fams = r === 'quran' ? ['Amiri Quran'] : Object.keys(FAMS);
    return `<div class="frow" data-r="${r}" id="f-${r}"><span>${label}</span>
      <select data-f>${fams.map(f => `<option ${f === c.font ? 'selected' : ''}>${f}</option>`).join('')}</select>
      <select data-w>${(FAMS[c.font] || [400]).map(w => `<option ${w === +c.weight ? 'selected' : ''}>${w}</option>`).join('')}</select>
      <input data-s type="number" min="9" max="80" value="${c.size || 14}">
      ${r === 'quran' ? '<span class="sample">متن قرآنِ صفحه‌های حفظ فقط با قلم قرآنیِ عثمانی.</span>' : ''}</div>`;
  }).join('');
}
$('fontList').addEventListener('change', e => {
  const row = e.target.closest('.frow'); const r = row.dataset.r; const c = { ...(design.fonts[r] || {}) };
  if (e.target.matches('[data-f]')) { c.font = e.target.value; const ws = FAMS[c.font]; if (!ws.includes(+c.weight)) c.weight = ws.includes(400) ? 400 : ws[0]; }
  if (e.target.matches('[data-w]')) c.weight = +e.target.value;
  if (e.target.matches('[data-s]')) c.size = +e.target.value;
  design.fonts[r] = c; push(); buildFonts(); highlight(r);
});
$('fontList').addEventListener('input', e => { if (!e.target.matches('[data-s]')) return; const r = e.target.closest('.frow').dataset.r;
  design.fonts[r] = { ...design.fonts[r], size: +e.target.value }; clearTimeout(push.t); push.t = setTimeout(push, 120); });
function highlight(r) { document.querySelectorAll('.frow').forEach(x => x.classList.toggle('hi', x.dataset.r === r)); const el = $('f-' + r); el && el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
function hookPick() {
  const doc = frame.contentDocument; if (!doc || doc.__nabatHooked) return; doc.__nabatHooked = true;
  doc.addEventListener('click', e => {
    if ($('pick').getAttribute('aria-pressed') !== 'true') return;
    const el = e.target.closest('[data-role]'); if (!el) return;
    e.preventDefault(); e.stopPropagation(); tab('fonts'); highlight(el.dataset.role);
  }, true);
}
$('pick').onclick = e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on);
  try { frame.contentDocument.body.style.outline = on ? '3px dashed #3a7d47' : ''; } catch (x) {} };

/* ---------- art ---------- */
function buildArt() {
  const w = frame.contentWindow, set = (w.NABAT_ART || {})[design.art || 'a2'] || {};
  $('artSel').value = design.art || 'a2';
  const names = { 'splash.svg': 'مینیمال تازه (پیش‌فرض)', 'splash-first.svg': 'اولی' };
  $('splashSel').innerHTML = Object.keys(set).filter(k => k.startsWith('splash')).map(k => `<option value="${k}" ${k === design.splash ? 'selected' : ''}>${names[k] || k}</option>`).join('');
  $('boil').checked = design.boil !== false;
}
$('artSel').onchange = e => { design.art = e.target.value; push(); buildArt(); };
$('splashSel').onchange = e => { design.splash = e.target.value; push(); go('splash'); };
$('boil').onchange = e => { design.boil = e.target.checked; push(); };

/* ---------- screens / tabs / actions ---------- */
function buildJump() { $('jump').innerHTML = SCREENS.map(([k, l]) => `<button data-s="${k}">${l}</button>`).join(''); }
function go(r) { try { frame.contentWindow.NABAT_go(r); } catch (e) {} document.querySelectorAll('#jump button').forEach(b => b.classList.toggle('on', b.dataset.s === r)); }
$('jump').onclick = e => { const b = e.target.closest('[data-s]'); if (b) go(b.dataset.s); };
function tab(name) { document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + name)); }
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) tab(b.dataset.tab); };
$('dl').onclick = () => {
  const out = { art: design.art || 'a2', splash: design.splash || 'splash.svg', boil: design.boil !== false, fonts: design.fonts, copy: design.copy };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = 'design.json'; a.click(); flash('دانلود شد. design.json را در هاست جایگزین کن.');
};
$('clear').onclick = () => { if (!confirm('همه‌ی تغییرهای این مرورگر پاک شود و طراحیِ منتشرشده برگردد؟')) return;
  try { localStorage.removeItem(DKEY); } catch (e) {} location.reload(); };
$('demo').onclick = () => { try { localStorage.removeItem('nabat-state-preview'); } catch (e) {} frame.contentWindow.location.reload(); };
window.addEventListener('message', e => { if (e.data && e.data.nabat === 'route') document.querySelectorAll('#jump button').forEach(b => b.classList.toggle('on', b.dataset.s === e.data.route)); });
frame.addEventListener('load', () => { try { frame.contentDocument.__nabatHooked = false; } catch (e) {} });
init();
</script>
</body>
</html>
